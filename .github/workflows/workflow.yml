name: MLOps Pipeline

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Comentar inicio CI/CD
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4

        with:
          issue-number: ${{ github.event.pull_request.number }}

          body: |
            CI/CD en acción. Ejecutando tareas …

      - name: Configurar Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: |
          pytest

      - name: Comentar fin CI/CD

        if: success() && github.event_name == 'pull_request'

        uses: peter-evans/create-or-update-comment@v4

        with:
          issue-number: ${{ github.event.pull_request.number }}

          body: |
            CI/CD terminado con éxito.

  docker:
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry

        uses: docker/login-action@v3

        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagen Docker

        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/medical-mlops:latest .

      - name: Publicar imagen

        run: |
          docker push ghcr.io/${{ github.repository_owner }}/medical-mlops:latest
